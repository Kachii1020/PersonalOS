name: cron

# Vercel Hobby의 크론 제한을 피해 스케줄러를 GitHub Actions에 둔다 (SPEC.md 9절).
# 지금은 Phase 1 잡 2개만 등록한다. fetch-prices / fetch-github은 Phase 3에서 추가한다.

on:
  schedule:
    # UTC 기준. Asia/Tokyo = UTC+9.
    - cron: "0 * * * *" # 매시 정각 — 캘린더 동기화
    - cron: "20 21 * * *" # 06:20 JST — 뉴스 수집
    - cron: "40 21 * * *" # 06:40 JST — 브리핑 생성 (뉴스 수집 20분 뒤)
  workflow_dispatch:
    inputs:
      job:
        description: "수동 실행할 잡"
        required: true
        type: choice
        options: [sync-calendar, fetch-news, generate-briefing]

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: 잡 호출
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            jobs="${{ inputs.job }}"
          elif [ "${{ github.event.schedule }}" = "20 21 * * *" ]; then
            jobs="fetch-news"
          elif [ "${{ github.event.schedule }}" = "40 21 * * *" ]; then
            jobs="generate-briefing"
          else
            jobs="sync-calendar"
          fi

          for job in $jobs; do
            echo "→ $job"
            code=$(curl -sS -o /tmp/out.json -w '%{http_code}' \
              -X POST "$APP_URL/api/jobs/$job" \
              -H "x-cron-secret: $CRON_SECRET" \
              --max-time 120)
            cat /tmp/out.json
            echo
            # 402는 월 AI 예산 소진이다. 정상적인 차단이므로 실패로 보지 않는다.
            if [ "$code" = "402" ]; then
              echo "::warning::$job 건너뜀 — 월 AI 예산 소진"
              continue
            fi
            # 잡이 실패를 sync_state에 기록해도, 워크플로도 같이 빨갛게 만든다.
            if [ "$code" -ge 400 ]; then
              echo "::error::$job 실패 (HTTP $code)"
              exit 1
            fi
          done
