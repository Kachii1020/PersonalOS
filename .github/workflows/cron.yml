name: cron

# Vercel Hobby의 크론 제한을 피해 스케줄러를 GitHub Actions에 둔다 (SPEC.md 9절).
#
# sync-ics는 일부러 스케줄에 넣지 않았다. MyWaseda가 구독 가능한 라이브 URL을 주는지
# 확정되지 않았고(SPEC.md 5.1b 미확정 항목), WASEDA_ICS_URL 없이 돌리면 매일 실패한다.
# 지금은 /settings 수동 업로드가 정식 경로다. URL이 확인되면 스케줄을 추가한다.

on:
  schedule:
    # UTC 기준. Asia/Tokyo = UTC+9.
    - cron: "0 * * * *" # 매시 정각 — 캘린더 동기화
    - cron: "20 21 * * *" # 06:20 JST — 뉴스 수집
    - cron: "40 21 * * *" # 06:40 JST — 브리핑 생성 (뉴스 수집 20분 뒤)
    - cron: "0 22 * * *" # 07:00 JST — 퀴즈 생성
    - cron: "30 22 * * *" # 07:30 JST — 시세 + 환율
    - cron: "45 22 * * *" # 07:45 JST — GitHub 수집
    - cron: "50 22 * * 1" # 07:50 JST 월요일 — 매크로 지표 (주 1회, BIS 포함)
    - cron: "0 23 1 * *"  # 08:00 JST 매월 1일 — SEC EDGAR 실적
    - cron: "0 12 * * 0" # 21:00 JST 일요일 — 주간 리뷰
  workflow_dispatch:
    inputs:
      job:
        description: "수동 실행할 잡"
        required: true
        type: choice
        options: [sync-calendar, fetch-news, generate-briefing, generate-quiz, fetch-prices, sync-github, sync-ics, fetch-macro, fetch-sec-filings, generate-weekly-review]

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: 잡 호출
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            jobs="${{ inputs.job }}"
          elif [ "${{ github.event.schedule }}" = "20 21 * * *" ]; then
            jobs="fetch-news"
          elif [ "${{ github.event.schedule }}" = "40 21 * * *" ]; then
            jobs="generate-briefing"
          elif [ "${{ github.event.schedule }}" = "0 22 * * *" ]; then
            jobs="generate-quiz"
          elif [ "${{ github.event.schedule }}" = "30 22 * * *" ]; then
            jobs="fetch-prices"
          elif [ "${{ github.event.schedule }}" = "45 22 * * *" ]; then
            jobs="sync-github"
          elif [ "${{ github.event.schedule }}" = "50 22 * * 1" ]; then
            jobs="fetch-macro"
          elif [ "${{ github.event.schedule }}" = "0 23 1 * *" ]; then
            jobs="fetch-sec-filings"
          elif [ "${{ github.event.schedule }}" = "0 12 * * 0" ]; then
            jobs="generate-weekly-review"
          else
            jobs="sync-calendar"
          fi

          APP_URL="${APP_URL%/}"
          if [ -z "$APP_URL" ]; then
            echo "::error::APP_URL secret이 비어 있습니다."
            exit 1
          fi
          echo "APP_URL=$APP_URL"

          for job in $jobs; do
            echo "→ $job"
            code=$(curl -sS -o /tmp/out.json -w '%{http_code}' \
              -X POST "$APP_URL/api/jobs/$job" \
              -H "x-cron-secret: $CRON_SECRET" \
              --max-time 120)
            echo "HTTP $code"
            cat /tmp/out.json
            echo
            # 402는 월 AI 예산 소진이다. 정상적인 차단이므로 실패로 보지 않는다.
            if [ "$code" = "402" ]; then
              echo "::warning::$job 건너뜀 — 월 AI 예산 소진"
              continue
            fi
            if [ "$code" -ge 300 ] && [ "$code" -lt 400 ]; then
              echo "::error::$job 이 리다이렉트됐다 (HTTP $code). GitHub secret APP_URL을 https://…vercel.app 로 넣고 끝 슬래시를 빼세요. curl -L 는 POST를 GET으로 바꿔 잡을 실행하지 않습니다."
              exit 1
            fi
            # 잡이 실패를 sync_state에 기록해도, 워크플로도 같이 빨갛게 만든다.
            if [ "$code" -ge 400 ]; then
              echo "::error::$job 실패 (HTTP $code)"
              exit 1
            fi
          done
