name: JARVIS

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      job:
        description: "실행할 JARVIS 작업"
        required: true
        default: all
        type: choice
        options: [all, monitor-career-sources, process-system-events, process-approved-actions, generate-command-brief]

permissions:
  contents: read

concurrency:
  group: jarvis-workers
  cancel-in-progress: false

jobs:
  run:
    # Manual deployment checks can run first. Enable the repository variable
    # only after the hosted and physical-device acceptance flow is verified.
    if: github.event_name == 'workflow_dispatch' || vars.JARVIS_CRON_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: 승인된 JARVIS 작업 처리
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          REQUESTED_JOB: ${{ inputs.job }}
          CAREER_MONITOR_ENABLED: ${{ vars.JARVIS_CAREER_ENABLED }}
        run: |
          set -euo pipefail
          APP_URL="${APP_URL%/}"
          case "$APP_URL" in
            https://*) ;;
            *) echo "::error::APP_URL must be an HTTPS deployment URL"; exit 1 ;;
          esac
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET is missing"
            exit 1
          fi
          case "${REQUESTED_JOB:-all}" in
            all)
              jobs="process-system-events process-approved-actions generate-command-brief"
              if [ "$CAREER_MONITOR_ENABLED" = "true" ]; then jobs="monitor-career-sources $jobs"; fi ;;
            monitor-career-sources|process-system-events|process-approved-actions|generate-command-brief) jobs="$REQUESTED_JOB" ;;
            *) echo "::error::Unknown JARVIS job"; exit 1 ;;
          esac
          for job in $jobs; do
            response=$(mktemp)
            code=$(curl -sS -o "$response" -w '%{http_code}' \
              -X POST "$APP_URL/api/jobs/$job" \
              -H "x-cron-secret: $CRON_SECRET" \
              --connect-timeout 15 --max-time 120)
            echo "$job: HTTP $code"
            # Keep private task/approval payloads out of Actions logs.
            if [ "$code" != "200" ]; then
              echo "::error::$job failed; inspect application job_runs for details"
              exit 1
            fi
            jq -e 'type == "object" and (has("error") | not)' "$response" >/dev/null
          done
